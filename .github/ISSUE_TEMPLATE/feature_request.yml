name: Feature request
description: An idea that keeps GridFail offline-first.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      placeholder: Learners can't…
    validations:
      required: true
  - type: textarea
    id: offline
    attributes:
      label: How does it work offline?
      description: Every feature must have an offline path. What happens with no connection?
      placeholder: Works fully offline because…
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: Could also…
